services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_dast_orchestrator
    env_file:
      - .env
    environment:
      - ZAP_API_URL=http://zap:8080
      - PYTHONPATH=/app
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      zap:
        condition: service_started
    command: ["python3", "run_mvp.py", "--mode", "adaptive"]

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    container_name: agentic_dast_zap
    environment:
      ZAP_PORT: "8080"
      ZAP_API_KEY: ${ZAP_API_KEY:-changeme}
    command:
      - sh
      - -c
      - >
        zap.sh -daemon -host 0.0.0.0 -port 8080
        -config api.addrs.addr.name=.*
        -config api.addrs.addr.regex=true
        -config api.key=${ZAP_API_KEY:-changeme}
        -config ajaxSpider.browserId=firefox-headless
    ports:
      - "127.0.0.1:18080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
